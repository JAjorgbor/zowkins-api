openapi: 3.0.0
info:
  title: Admin Referral Partner API
  version: 1.0.0
tags:
  - name: Admin Referral Partner
    description: Referral partner management for admins

paths:
  /admin/referral-partners:
    get:
      tags:
        - Admin Referral Partner
      summary: Get all referral partners
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReferralPartner"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags:
        - Admin Referral Partner
      summary: Add a new referral partner
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddReferralPartnerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralPartner"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/referral-partners/top:
    get:
      tags:
        - Admin Referral Partner
      summary: Get top referral partners leaderboard
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  partners:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/ReferralPartner"
                        - type: object
                          properties:
                            referralsCount:
                              type: integer
                            commissionTotal:
                              type: number
                            orders:
                              type: integer
                            user:
                              type: object
                              properties:
                                firstName:
                                  type: string
                                lastName:
                                  type: string
                                email:
                                  type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/referral-partners/detail/{partnerId}:
    get:
      tags:
        - Admin Referral Partner
      summary: Get referral partner details
      security:
        - bearerAuth: []
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralPartner"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/referral-partners/{partnerId}:
    patch:
      tags:
        - Admin Referral Partner
      summary: Update referral partner
      security:
        - bearerAuth: []
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReferralPartnerInput"
      responses:
        "200":
          description: OK
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags:
        - Admin Referral Partner
      summary: Delete referral partner
      security:
        - bearerAuth: []
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/referral-partners/toggle-status/{partnerId}:
    patch:
      tags:
        - Admin Referral Partner
      summary: Toggle referral partner status
      security:
        - bearerAuth: []
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/referral-partners/referrals/{partnerId}:
    get:
      tags:
        - Admin Referral Partner
      summary: Get referral partner referrals
      security:
        - bearerAuth: []
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  referrals:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReferralUser"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Bad Request
    Forbidden:
      description: Forbidden
    Unauthorized:
      description: Unauthorized
    NotFound:
      description: Not Found
  schemas:
    ReferralPartner:
      type: object
      properties:
        id:
          type: string
        user:
          type: string
        referralCode:
          type: string
        status:
          type: string
          enum: [active, inactive]
        profession:
          type: string
        commission:
          type: object
          properties:
            rate:
              type: number
            rateType:
              type: string
        accountDetails:
          $ref: "#/components/schemas/AccountDetails"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReferralUser:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        status:
          type: string
        joinedAt:
          type: string
          format: date-time

    AddReferralPartnerInput:
      type: object
      required:
        - user
        - commissionRate
        - profession
      properties:
        user:
          type: string
        commissionRate:
          type: number
        profession:
          type: string
          enum: [doctor, nurse, pharmacist, chemist, lab technician, other]
        accountDetails:
          $ref: "#/components/schemas/AccountDetails"

    UpdateReferralPartnerInput:
      type: object
      properties:
        commissionRate:
          type: number
        profession:
          type: string
          enum: [doctor, nurse, pharmacist, chemist, lab technician, other]
        accountDetails:
          $ref: "#/components/schemas/AccountDetails"

    AccountDetails:
      type: object
      required:
        - bankName
        - bankCode
        - accountNumber
        - accountName
      properties:
        bankName:
          type: string
        bankCode:
          type: string
        accountNumber:
          type: string
        accountName:
          type: string
