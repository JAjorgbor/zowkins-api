openapi: 3.0.0
info:
  title: Portal Referral Partner API
  version: 1.0.0
tags:
  - name: Portal Referral Partner
    description: Referral partner features for logged-in portal users

paths:
  /portal/referral-partners/me:
    get:
      tags:
        - Portal Referral Partner
      summary: Get current referral partner's details
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  partner:
                    $ref: "#/components/schemas/ReferralPartner"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags:
        - Portal Referral Partner
      summary: Update current referral partner's details
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReferralPartnerInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  partner:
                    $ref: "#/components/schemas/ReferralPartner"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /portal/referral-partners/me/referrals:
    get:
      tags:
        - Portal Referral Partner
      summary: Get current partner's referred users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  referrals:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReferralUser"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /portal/referral-partners/me/referrals/{userId}:
    get:
      tags:
        - Portal Referral Partner
      summary: Get details of a referred user
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/ReferralUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /portal/referral-partners/me/referrals/{userId}/orders:
    get:
      tags:
        - Portal Referral Partner
      summary: Get orders of a referred user
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      type: object # You might want to define an Order schema if available
        "401":
          $ref: "#/components/responses/Unauthorized"

  /portal/referral-partners/me/referrals/{userId}/orders/{orderId}:
    get:
      tags:
        - Portal Referral Partner
      summary: Get a specific order of a referred user
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Bad Request
    Forbidden:
      description: Forbidden
    Unauthorized:
      description: Unauthorized
    NotFound:
      description: Not Found
  schemas:
    ReferralPartner:
      type: object
      properties:
        id:
          type: string
        user:
          type: string
        referralCode:
          type: string
        status:
          type: string
          enum: [active, inactive]
        profession:
          type: string
        commission:
          type: object
          properties:
            rate:
              type: number
            rateType:
              type: string
        accountDetails:
          $ref: "#/components/schemas/AccountDetails"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AccountDetails:
      type: object
      properties:
        bankName:
          type: string
        bankCode:
          type: string
        accountNumber:
          type: string
        accountName:
          type: string

    ReferralUser:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        status:
          type: string
        joinedAt:
          type: string
          format: date-time

    UpdateReferralPartnerInput:
      type: object
      properties:
        commissionRate:
          type: number
        profession:
          type: string
          enum: [doctor, nurse, pharmacist, chemist, lab technician, other]
        accountDetails:
          $ref: "#/components/schemas/AccountDetails"
