openapi: 3.0.3
info:
  title: Users API (fragment)
  version: "1.0.0"
tags:
  - name: Admin Category
    description: Operations related to categories from using the admin access
paths:
  /admin/categories:
    post:
      tags:
        - Admin Category
      summary: Create a new category
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - files
                - data
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Category image(s)
                data:
                  $ref: "#/components/schemas/CreateCategoryDto"
      responses:
        "201":
          description: Category created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

    get:
      tags:
        - Admin Category
      summary: Retrieve all categories
      security:
        - bearerAuth: []

      responses:
        "200":
          description: List of categories retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /admin/categories/{id}:
    get:
      tags:
        - Admin Category
      summary: Get category by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Category found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags:
        - Admin Category
      summary: Update a category
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - data
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Updated category image(s)
                data:
                  $ref: "#/components/schemas/UpdateCategoryDto"
      responses:
        "200":
          description: Category updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

    delete:
      tags:
        - Admin Category
      summary: Delete a category
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Category deleted successfully
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 10
    search:
      name: search
      in: query
      required: false
      schema:
        type: string
  responses:
    BadRequest:
      description: Bad Request
    Unauthorized:
      description: Unauthorized
    NotFound:
      description: Not Found
  schemas:
    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        image:
          type: object
          properties:
            url:
              type: string
            key:
              type: string
        visible:
          type: boolean
        subcategories:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              _id:
                type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateCategoryDto:
      type: object
      required:
        - name
        - description
        - subcategories
      properties:
        name:
          type: string
        description:
          type: string
        visible:
          type: boolean
          default: true
        subcategories:
          type: array
          items:
            type: object
            required:
              - name
            properties:
              name:
                type: string

    UpdateCategoryDto:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        visible:
          type: boolean
        subcategories:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
