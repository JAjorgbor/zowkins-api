openapi: 3.0.0
info:
  title: Admin Customer Management API
  version: 1.0.0
tags:
  - name: Admin Customer
    description: Customer management for admins

paths:
  /admin/customers:
    get:
      tags:
        - Admin Customer
      summary: Get all customers
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, active, inactive, waitlist]
        - name: isReferralPartner
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/customers/stats:
    get:
      tags:
        - Admin Customer
      summary: Get general customer statistics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  stats:
                    type: object
                    properties:
                      totalUsers:
                        type: integer
                      activeUsers:
                        type: integer
                      inactiveUsers:
                        type: integer
                      pendingUsers:
                        type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/customers/non-referral-partners:
    get:
      tags:
        - Admin Customer
      summary: Get customers who are not referral partners
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/customers/{userId}:
    get:
      tags:
        - Admin Customer
      summary: Get customer details
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags:
        - Admin Customer
      summary: Update customer
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerInput"
      responses:
        "200":
          description: OK
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags:
        - Admin Customer
      summary: Delete customer
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Bad Request
    Forbidden:
      description: Forbidden
    Unauthorized:
      description: Unauthorized
    NotFound:
      description: Not Found
  schemas:
    Customer:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
        gender:
          type: string
          enum: [male, female]
        status:
          type: string
          enum: [pending, active, inactive, waitlist]
        isReferralPartner:
          type: boolean
        referredBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpdateCustomerInput:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        status:
          type: string
          enum: [pending, active, inactive, waitlist]
        isReferralPartner:
          type: boolean
        email:
          type: string
        phoneNumber:
          type: string
