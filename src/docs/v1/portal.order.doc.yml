components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
        orderNumber:
          type: string
        customer:
          type: string
        products:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
              productName:
                type: string
              quantity:
                type: number
              price:
                type: number
              amount:
                type: number
        transaction:
          type: object
          properties:
            deliveryFee:
              type: number
            totalAmount:
              type: number
        deliveryAddress:
          $ref: "#/components/schemas/DeliveryAddress"
        deliveryMethod:
          $ref: "#/components/schemas/DeliveryMethod"
        orderStatus:
          type: string
          enum: [processing, in-transit, cancelled, delivered]
        paymentStatus:
          type: string
          enum: [pending, paid, failed, abandoned, reversed]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

tags:
  - name: Portal Order
    description: Order management for portal users

paths:
  /portal/orders:
    post:
      summary: Create a new order
      tags: [Portal Order]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer, items, deliveryAddress, deliveryMethod]
              properties:
                customer:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      productId:
                        type: string
                      quantity:
                        type: number
                deliveryAddress:
                  type: string
                deliveryMethod:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  order:
                    $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

    get:
      summary: Get all orders for the authenticated portal user
      tags: [Portal Order]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: sortBy
          schema:
            type: string
          description: sort by query in the form of field:desc/asc (ex. name:asc)
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            default: 10
          description: Maximum number of orders
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /portal/orders/{orderId}:
    get:
      summary: Get a specific order
      tags: [Portal Order]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
          description: Order ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  order:
                    $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /portal/orders/recent:
    get:
      summary: Get portal user recent orders
      tags: [Portal Order]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /portal/orders/stats:
    get:
      summary: Get portal user order statistics
      tags: [Portal Order]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  stats:
                    type: object
                    properties:
                      totalOrders:
                        type: integer
                      processing:
                        type: integer
                      completed:
                        type: integer
                      cancelled:
                        type: integer
                      inTransit:
                        type: integer
                      totalSpent:
                        type: number
        "401":
          $ref: "#/components/responses/Unauthorized"
