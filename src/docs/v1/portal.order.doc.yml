components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
        orderNumber:
          type: string
        customer:
          type: string
          description: Customer id. Guest checkouts get a guest customer record, so this is always set
        customerDetails:
          type: object
          description: Contact details as entered at checkout (snapshot, not updated by later profile edits)
          properties:
            firstName:
              type: string
            lastName:
              type: string
            email:
              type: string
            phoneNumber:
              type: string
        isGuestOrder:
          type: boolean
          description: true when the order was placed without being logged in
        products:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
              productName:
                type: string
              quantity:
                type: number
              price:
                type: number
              amount:
                type: number
        quoteDetails:
          type: object
          properties:
            items:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  quantity:
                    type: number
            note:
              type: string
            file:
              type: object
              properties:
                url:
                  type: string
                key:
                  type: string
        transaction:
          type: object
          properties:
            deliveryFee:
              type: number
            totalAmount:
              type: number
        deliveryAddress:
          $ref: "#/components/schemas/DeliveryAddress"
        deliveryMethod:
          $ref: "#/components/schemas/DeliveryMethod"
        orderStatus:
          type: string
          enum: [processing, in-transit, cancelled, delivered]
        paymentStatus:
          type: string
          enum: [pending, paid, failed, abandoned, reversed]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RequestOrderQuoteDto:
      type: object
      required: [deliveryAddress]
      properties:
        customer:
          $ref: "#/components/schemas/CustomerDetailsInput"
        items:
          type: array
          items:
            type: object
            required: [name, quantity]
            properties:
              name:
                type: string
              quantity:
                type: number
        deliveryAddress:
          oneOf:
            - type: string
              description: Id of a saved address (logged-in customers only)
            - $ref: "#/components/schemas/DeliveryAddressInput"
        note:
          type: string

    CustomerDetailsInput:
      type: object
      description: Required when not logged in. Ignored when an Authorization header is sent.
      required: [firstName, lastName, email, phoneNumber]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        gender:
          type: string
          enum: [male, female]
        email:
          type: string
          format: email
        phoneNumber:
          type: string

    DeliveryAddressInput:
      type: object
      required: [phoneNumber, street, city, state]
      properties:
        phoneNumber:
          type: string
          minLength: 9
        street:
          type: string
          minLength: 3
        city:
          type: string
          minLength: 2
        state:
          type: string
          minLength: 2
        country:
          type: string
          default: Nigeria
        postalCode:
          type: string

tags:
  - name: Portal Order
    description: Order management for portal users

paths:
  /portal/orders:
    post:
      summary: Place an order (logged in or as a guest)
      description: |
        **Logged in** (Authorization header sent): the customer is taken from the token and
        `customer` is ignored. `deliveryAddress` can be a saved address id or a full address.

        **Guest** (no Authorization header): `customer` and a full `deliveryAddress` object are
        required. The customer is saved by email: a new email creates a guest record, a returning
        guest email reuses it and refreshes its contact details, and the address is added to the
        guest's address book (duplicates skipped). When that email later creates an account (or
        completes a password reset), these orders appear in it. If the email already belongs to
        a registered account, the order is attached to it without changing its profile.

        Sending an invalid or expired token returns 401; it is not treated as a guest checkout.
      tags: [Portal Order]
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, deliveryAddress, deliveryMethod]
              properties:
                customer:
                  $ref: "#/components/schemas/CustomerDetailsInput"
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [productId, quantity]
                    properties:
                      productId:
                        type: string
                      quantity:
                        type: integer
                        minimum: 1
                deliveryAddress:
                  oneOf:
                    - type: string
                      description: Id of an address saved on the customer (logged-in customers / existing customers only)
                    - $ref: "#/components/schemas/DeliveryAddressInput"
                deliveryMethod:
                  type: string
                callbackUrl:
                  type: string
                  format: uri
                generatePaymentLink:
                  type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  paymentLink:
                    type: string
                    format: uri
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    get:
      summary: Get all orders for the authenticated portal user
      tags: [Portal Order]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: sortBy
          schema:
            type: string
          description: sort by query in the form of field:desc/asc (ex. name:asc)
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            default: 10
          description: Maximum number of orders
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /portal/orders/{orderId}:
    get:
      summary: Get a specific order
      tags: [Portal Order]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
          description: Order ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  order:
                    $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /portal/orders/recent:
    get:
      summary: Get portal user recent orders
      tags: [Portal Order]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /portal/orders/stats:
    get:
      summary: Get portal user order statistics
      tags: [Portal Order]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  stats:
                    type: object
                    properties:
                      totalOrders:
                        type: integer
                      processing:
                        type: integer
                      completed:
                        type: integer
                      cancelled:
                        type: integer
                      inTransit:
                        type: integer
                      totalSpent:
                        type: number
        "401":
          $ref: "#/components/responses/Unauthorized"

  /portal/orders/quote:
    post:
      summary: Request an order quote (logged in or as a guest)
      description: |
        Same customer rules as placing an order: logged-in customers are taken from the token;
        guests must send `customer` and a full `deliveryAddress`, and are saved as guest customers
        so the quote shows up in their account if they sign up later with that email.
      tags: [Portal Order]
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [data]
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: "Upload quote document(s) (Note: only the first image is saved)"
                data:
                  $ref: "#/components/schemas/RequestOrderQuoteDto"
            encoding:
              data:
                contentType: application/json
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  order:
                    $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
